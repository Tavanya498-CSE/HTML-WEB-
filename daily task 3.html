<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daily task 3</title>
    <style>
        h2{
            border:3px solid black;
            text-align: center;
            border-radius: 10px;
            background-color: white;
            margin:auto;
            width:250px;
            height: 40px;
        }
        h3{
            color:white;
            text-align: end;
        }
        .calculator{
            border:3px solid black;
            background-color: black;
            margin:auto;
            text-align: center;
            width:300px;
            padding:20px;
            border-radius: 15px;
        }
        button{
            width:60px;
            height:60px;
            background-color: rgb(51, 50, 50);
            color: white;
            border-radius: 50%;
            font-size: 30px;
            gap: 15px;
            border: 2px solid black;
        }
        .symbols{
            background-color: rgb(104, 95, 95);
            color:black;
        }
        .operator{
            background-color: rgb(252, 164, 2);
        }
    </style>
</head>
<body>
    
    <div class="calculator">
        <h2>Welcome to Calculator</h2>
        <h3>0</h3>
        <div class="button">
        <button class="symbols">AC</button>
        <b><button class="symbols"> ← </button></b>
        <button class="symbols">%</button>
        <button class="operator">÷</button><br><br>   
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">x</button><br><br>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">-</button><br><br>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button><br><br>
        <button>0</button>
        <button>00</button>
        <button>.</button>
        <button class="operator">=</button>
    </div>
        </div>
</body>
</html>
