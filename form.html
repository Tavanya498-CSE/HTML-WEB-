<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>STUDENT REGISTRATION FORM</h1><BR>
    <label>NAME :</label>
    <input type="text" placeholder="enter your name"><br><BR>
    <label>Email :</label>
    <input type="mail" placeholder="enter your Email"><br><BR>
    <label>PASSWORD :</label>
    <input type="password" placeholder="enter your password"><br><BR>
    <label>AGE :</label>
    <input type="NUMBER" placeholder="enter your age"><br><BR>
    <label>DATE OF BIRTH :</label>
    <input type="date"> <br><BR>
    <label>GENDER :</label><BR><BR>
    <label>MALE</label>
    <input type="radio" name="male">
    <label>FEMALE</label>
    <input type="radio" name="female"><br><BR>
    <label>DEPARTMENT : </label>
    <SELECT>
        <OPTION> SELECT DEPARTMENT</OPTION>
        <OPTION>CSE</OPTION>
        <OPTION>ECE</OPTION>
        <OPTION>AI/DS</OPTION> 
        <OPTION>IT</OPTION>
    </SELECT><BR><BR>
    <LABEL>SKILLS :</LABEL><BR><BR>
    <LABEL>HTML</LABEL>
    <INPUT TYPE="CHECKBOX"NAME="HTML">
    <LABEL>CSS</LABEL>
    <INPUT TYPE="CHECKBOX"NAME="CSS">
    <LABEL>JAVASCRIPT</LABEL>
    <INPUT TYPE="CHECKBOX"NAME="JAVASCRIPT"><BR><BR>
    <LABEL>ADDRESS :</LABEL>
    <textarea
     PLACEHOLDER="ENTER YOUR ADDRESS"></textarea>
    
    

</body>
</html>
