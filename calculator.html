<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daily task 3</title>
    <style>
        h2{
            text-align: center;
            font-family:Georgia, 'Times New Roman', Times, serif;
            
        }
        .calculator{
            width: 300px;
            margin: auto;
            border: 3px solid black;
            padding: 20px;
            border-radius:10px;
            text-align: center;
            background-color: rgb(199, 136, 188);
        }
        input{
            background-color: pink;
            width: 300px;
            height: 35px;
            margin bottom:10px;
            font size: 30px;
        }
        button{
            background-color: rgb(162, 76, 162);
            color: black;
            width:60px;
            height:30px;
            margin:4px;
            font-size: large;
            border:3px solid wheat;
        }

    </style>
</head>
<body>
    <h2>CALCULATOR</h2>
    <div class="calculator">
        <input type="text"><br><br>
        <button>AC</button>
        <button>DEL</button>
        <button>/</button>
        <button>*</button><br><br>
        <button>7  </button>
        <button>8</button>
        <button>9</button>
        <button>-</button><br><br>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>+</button><br><br>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>=</button><br><br>
        <button>%</button>
        <button>0</button>
        <button>.</button>

    </div>
    
</body>
</html>
